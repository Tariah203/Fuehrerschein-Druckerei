<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Druckgenerator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* A4 Landscape Aspect Ratio Box (297mm x 210mm) */
        .a4-landscape-aspect {
            aspect-ratio: 297 / 210;
        }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col justify-between font-sans">

    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-print text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">PDF Druckgenerator</h1>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl w-full mx-auto p-4 md:p-8 flex-1">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Left Column: Input Form -->
            <div class="lg:col-span-5 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                <form id="pdfForm" onsubmit="generateAndPrintPDF(event)" class="space-y-5">
                    
                    <!-- Foto Upload -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Foto</label>
                        <div class="flex items-center space-x-3">
                            <label class="cursor-pointer bg-slate-50 hover:bg-slate-100 border border-slate-300 rounded-lg px-4 py-2.5 text-sm font-medium text-slate-700 flex items-center space-x-2 transition-all w-full justify-center">
                                <i class="fa-solid fa-camera text-slate-500"></i>
                                <span id="uploadBtnText">Foto auswählen...</span>
                                <input type="file" id="fotoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                            </label>
                            <button type="button" id="removePhotoBtn" onclick="removePhoto()" class="hidden bg-red-50 hover:bg-red-100 text-red-600 p-2.5 rounded-lg border border-red-200 transition-colors" title="Foto löschen">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Vorname (1 Zeile) -->
                    <div>
                        <label for="vorname" class="block text-sm font-semibold text-slate-700 mb-1.5">Vorname</label>
                        <div class="relative rounded-lg shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-user"></i>
                            </div>
                            <input type="text" id="vorname" placeholder="Vorname"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white text-slate-800 text-sm transition-all outline-none"
                                oninput="handleTextInput(this, 'vorname', 1)" />
                        </div>
                        <p id="vornameHint" class="hidden text-[11px] mt-1 font-medium"></p>
                    </div>

                    <!-- Name (2 Zeilen erlaubt) -->
                    <div>
                        <label for="nachname" class="block text-sm font-semibold text-slate-700 mb-1.5">
                            Name <span class="text-xs font-normal text-slate-500">(max. 2 Zeilen)</span>
                        </label>
                        <div class="relative rounded-lg shadow-sm">
                            <div class="absolute top-3 left-0 pl-3.5 flex items-start pointer-events-none text-slate-400">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <textarea id="nachname" rows="2" placeholder="Nachname / Familienname"
                                class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white text-slate-800 text-sm transition-all outline-none resize-none"
                                oninput="handleTextInput(this, 'nachname', 2)"></textarea>
                        </div>
                        <p id="nachnameHint" class="hidden text-[11px] mt-1 font-medium"></p>
                    </div>

                    <!-- geb. am -->
                    <div>
                        <label for="gebAm" class="block text-sm font-semibold text-slate-700 mb-1.5">geb. am</label>
                        <div class="relative rounded-lg shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-calendar"></i>
                            </div>
                            <input type="text" id="gebAm" placeholder="TT.MM.JJJJ" maxlength="10"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white text-slate-800 text-sm transition-all outline-none"
                                oninput="handleDateInput(this)" onblur="finalizeDateInput(this)" />
                        </div>
                        <p id="gebAmError" class="hidden text-xs text-red-600 mt-1 flex items-center space-x-1">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            <span>Ungültiges Datum. Bitte ein echtes Datum eingeben (z. B. 15.05.1990).</span>
                        </p>
                    </div>

                    <!-- in (2 Zeilen erlaubt) -->
                    <div>
                        <label for="gebOrt" class="block text-sm font-semibold text-slate-700 mb-1.5">
                            in <span class="text-xs font-normal text-slate-500">(Geburtsort, max. 2 Zeilen)</span>
                        </label>
                        <div class="relative rounded-lg shadow-sm">
                            <div class="absolute top-3 left-0 pl-3.5 flex items-start pointer-events-none text-slate-400">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <textarea id="gebOrt" rows="2" placeholder="Geburtsort"
                                class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white text-slate-800 text-sm transition-all outline-none resize-none"
                                oninput="handleTextInput(this, 'gebOrt', 2)"></textarea>
                        </div>
                        <p id="gebOrtHint" class="hidden text-[11px] mt-1 font-medium"></p>
                    </div>

                    <!-- Drucken Button -->
                    <div class="pt-3">
                        <button type="submit" 
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-indigo-200 transition-all duration-200 flex items-center justify-center space-x-2 text-base active:scale-[0.99]">
                            <i class="fa-solid fa-print"></i>
                            <span>Drucken</span>
                        </button>
                    </div>

                </form>
            </div>

            <!-- Right Column: Live Preview -->
            <div class="lg:col-span-7 flex flex-col items-center">
                <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col items-center">
                    <div class="w-full flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                        <h2 class="text-base font-bold text-slate-800">Live-Vorschau (A4 Querformat)</h2>
                    </div>

                    <!-- A4 Querformat Visual Container -->
                    <div class="w-full bg-slate-200 p-4 rounded-xl flex justify-center shadow-inner overflow-hidden">
                        <div id="previewSheet" class="a4-landscape-aspect w-full bg-white shadow-md rounded border border-slate-300 relative select-none overflow-hidden">
                            
                            <!-- 4x2 Grid helper lines (Faint) -->
                            <div class="absolute inset-0 grid grid-cols-4 grid-rows-2 pointer-events-none border-dashed border-slate-200">
                                <div class="border-r border-b border-slate-200"></div>
                                <div class="border-r border-b border-slate-200"></div>
                                <div class="border-r border-b border-slate-200"></div>
                                <div class="border-b border-slate-200"></div>
                                
                                <!-- Bottom-Left Panel ("Inhaber des Fahrausweises") -->
                                <div class="relative p-2 flex flex-col justify-start">
                                    <div class="text-[0.55rem] font-bold text-slate-400 mb-1 border-b border-slate-100 pb-0.5">Inhaber des Fahrausweises</div>
                                    
                                    <!-- Content Area inside Panel -->
                                    <div class="flex items-start space-x-2 mt-1">
                                        <!-- Photo Preview Box -->
                                        <div id="pFotoBox" class="w-[38%] aspect-[28/37] border border-slate-300 rounded bg-slate-50 flex flex-col items-center justify-center overflow-hidden shrink-0">
                                            <i id="pFotoPlaceholder" class="fa-regular fa-image text-slate-300 text-lg"></i>
                                            <img id="pFotoImg" class="w-full h-full object-cover hidden" alt="Foto Vorschau" />
                                        </div>

                                        <!-- Text Fields Preview -->
                                        <div class="flex-1 min-w-0 space-y-1 text-[0.55rem] leading-tight text-slate-900 font-sans">
                                            <div>
                                                <div id="pVorname" class="font-semibold text-slate-800 truncate"></div>
                                            </div>
                                            <div>
                                                <div id="pNachname" class="font-semibold text-slate-800 break-words line-clamp-2"></div>
                                            </div>
                                            <div>
                                                <div id="pGebAm" class="text-slate-700 truncate"></div>
                                            </div>
                                            <div>
                                                <div id="pGebOrt" class="text-slate-700 break-words line-clamp-2"></div>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div class="border-r border-slate-200"></div>
                                <div class="border-r border-slate-200"></div>
                                <div></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Hidden iframe for automatic print execution -->
    <iframe id="printIframe" class="hidden"></iframe>

    <script>
        const { jsPDF } = window.jspdf;
        let photoDataUrl = null;
        let dummyDoc = null;

        /**
         * Helper to escape HTML characters in live preview
         */
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        /**
         * Gets or creates a singleton jsPDF dummy instance for precise text width calculation
         */
        function getDummyDoc() {
            if (!dummyDoc && window.jspdf) {
                dummyDoc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
            }
            return dummyDoc;
        }

        /**
         * Calculates text wrapping and font size fitting inside exact PDF width
         */
        function calculateTextFit(text, maxWidth = 33, defaultFontSize = 9, minFontSize = 6.5, maxLines = 1) {
            const doc = getDummyDoc();
            if (!text || !doc) return { fontSize: defaultFontSize, lines: [], isOverflow: false };

            let fontSize = defaultFontSize;
            let lines = [];

            const rawLines = text.split('\n');
            if (rawLines.length > maxLines) {
                text = rawLines.slice(0, maxLines).join(' ');
            }

            while (fontSize >= minFontSize) {
                doc.setFont('Helvetica', 'normal');
                doc.setFontSize(fontSize);
                lines = doc.splitTextToSize(text, maxWidth);
                if (lines.length <= maxLines) {
                    return { fontSize, lines, isOverflow: false, text };
                }
                fontSize -= 0.5;
            }

            // At minFontSize, check if it exceeds maxLines
            doc.setFontSize(minFontSize);
            lines = doc.splitTextToSize(text, maxWidth);
            return {
                fontSize: minFontSize,
                lines: lines.slice(0, maxLines),
                isOverflow: lines.length > maxLines,
                text
            };
        }

        /**
         * Restricts text input so it never overflows allowed space at minimum font size
         */
        function handleTextInput(input, fieldType, maxLines) {
            let val = input.value;

            // Prevent manual line breaks exceeding max lines
            const rawLines = val.split('\n');
            if (rawLines.length > maxLines) {
                val = rawLines.slice(0, maxLines).join(' ');
                input.value = val;
            }

            // Test fit at min font size (6.5pt)
            let fit = calculateTextFit(val, 33, 9, 6.5, maxLines);

            // Truncate character-by-character if exceeding limits
            while (fit.isOverflow && val.length > 0) {
                val = val.slice(0, -1);
                input.value = val;
                fit = calculateTextFit(val, 33, 9, 6.5, maxLines);
            }

            // Update user feedback hint below input
            const hintEl = document.getElementById(fieldType + 'Hint');
            if (hintEl) {
                if (fit.isOverflow || val.length >= 80) {
                    hintEl.textContent = "Maximale Textlänge für das Feld erreicht!";
                    hintEl.className = "text-[11px] mt-1 font-semibold text-red-600 block";
                } else if (fit.fontSize < 9 && val.length > 0) {
                    hintEl.textContent = `Schriftgröße im Druck automatisch angepasst (${fit.fontSize} pt)`;
                    hintEl.className = "text-[11px] mt-1 font-medium text-amber-600 block";
                } else {
                    hintEl.textContent = "";
                    hintEl.className = "hidden";
                }
            }

            updatePreview();
        }

        /**
         * Validates if a string is a real calendar date (DD.MM.YYYY)
         */
        function isValidDate(dateStr) {
            if (!dateStr) return true; // empty is handled during validation if needed
            const parts = dateStr.split('.');
            if (parts.length !== 3) return false;

            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            const year = parseInt(parts[2], 10);

            if (isNaN(day) || isNaN(month) || isNaN(year)) return false;
            if (parts[2].length !== 4) return false;
            if (month < 1 || month > 12) return false;

            const currentYear = new Date().getFullYear();
            if (year < 1900 || year > currentYear) return false;

            // Days in specific month (accounts for leap years)
            const daysInMonth = new Date(year, month, 0).getDate();
            if (day < 1 || day > daysInMonth) return false;

            return true;
        }

        /**
         * Validates date input UI state and shows error if invalid
         */
        function validateDate(input) {
            const val = input.value.trim();
            const errorEl = document.getElementById('gebAmError');
            
            if (val.length > 0 && !isValidDate(val)) {
                input.classList.add('border-red-500', 'bg-red-50', 'focus:ring-red-500', 'focus:border-red-500');
                input.classList.remove('border-slate-300', 'bg-slate-50', 'focus:ring-indigo-500', 'focus:border-indigo-500');
                if (errorEl) errorEl.classList.remove('hidden');
                return false;
            } else {
                input.classList.remove('border-red-500', 'bg-red-50', 'focus:ring-red-500', 'focus:border-red-500');
                input.classList.add('border-slate-300', 'bg-slate-50', 'focus:ring-indigo-500', 'focus:border-indigo-500');
                if (errorEl) errorEl.classList.add('hidden');
                return true;
            }
        }

        /**
         * Handles photo file selection
         */
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                photoDataUrl = e.target.result;
                document.getElementById('uploadBtnText').textContent = file.name;
                document.getElementById('removePhotoBtn').classList.remove('hidden');
                updatePreview();
            };
            reader.readAsDataURL(file);
        }

        /**
         * Removes selected photo
         */
        function removePhoto() {
            photoDataUrl = null;
            document.getElementById('fotoInput').value = '';
            document.getElementById('uploadBtnText').textContent = 'Foto auswählen...';
            document.getElementById('removePhotoBtn').classList.add('hidden');
            updatePreview();
        }

        /**
         * Formats date automatically while typing digits (DD.MM.YYYY)
         */
        function handleDateInput(input) {
            let digits = input.value.replace(/\D/g, '');
            if (digits.length > 8) {
                digits = digits.substring(0, 8);
            }

            let formatted = '';
            if (digits.length > 4) {
                formatted = digits.slice(0, 2) + '.' + digits.slice(2, 4) + '.' + digits.slice(4);
            } else if (digits.length > 2) {
                formatted = digits.slice(0, 2) + '.' + digits.slice(2, 4);
            } else {
                formatted = digits;
            }

            input.value = formatted;
            validateDate(input);
            updatePreview();
        }

        /**
         * Ensures birth year is always 4 digits when leaving field or submitting form
         */
        function finalizeDateInput(input) {
            let digits = input.value.replace(/\D/g, '');
            if (digits.length >= 5) {
                let day = digits.slice(0, 2);
                let month = digits.slice(2, 4);
                let yearStr = digits.slice(4);

                if (yearStr.length === 2) {
                    const yearNum = parseInt(yearStr, 10);
                    const currentShortYear = new Date().getFullYear() % 100;
                    const fullYear = yearNum <= currentShortYear ? 2000 + yearNum : 1900 + yearNum;
                    input.value = `${day}.${month}.${fullYear}`;
                } else if (yearStr.length === 1) {
                    const yearNum = parseInt(yearStr, 10);
                    input.value = `${day}.${month}.200${yearNum}`;
                } else if (yearStr.length === 3) {
                    input.value = `${day}.${month}.1${yearStr}`;
                }
            }

            validateDate(input);
            updatePreview();
        }

        /**
         * Updates the live preview box with input text and photo
         */
        function updatePreview() {
            const vorname = document.getElementById('vorname').value.trim();
            const nachname = document.getElementById('nachname').value.trim();
            const gebAmInput = document.getElementById('gebAm');
            const gebAm = gebAmInput.value.trim();
            const gebOrt = document.getElementById('gebOrt').value.trim();

            const isDateValid = isValidDate(gebAm);

            // Vorname preview & scale
            const fitVorname = calculateTextFit(vorname, 33, 9, 6.5, 1);
            const pVorname = document.getElementById('pVorname');
            pVorname.textContent = fitVorname.lines.join(' ') || vorname;
            const scaleVorname = fitVorname.fontSize / 9;
            pVorname.style.fontSize = `${0.55 * scaleVorname}rem`;

            // Nachname preview & scale
            const fitNachname = calculateTextFit(nachname, 33, 9, 6.5, 2);
            const pNachname = document.getElementById('pNachname');
            pNachname.innerHTML = fitNachname.lines.map(l => `<div>${escapeHtml(l)}</div>`).join('') || escapeHtml(nachname);
            const scaleNachname = fitNachname.fontSize / 9;
            pNachname.style.fontSize = `${0.55 * scaleNachname}rem`;

            // geb. am preview
            document.getElementById('pGebAm').textContent = isDateValid ? gebAm : '';

            // Geburtsort preview & scale
            const fitGebOrt = calculateTextFit(gebOrt, 33, 9, 6.5, 2);
            const pGebOrt = document.getElementById('pGebOrt');
            pGebOrt.innerHTML = fitGebOrt.lines.map(l => `<div>${escapeHtml(l)}</div>`).join('') || escapeHtml(gebOrt);
            const scaleGebOrt = fitGebOrt.fontSize / 9;
            pGebOrt.style.fontSize = `${0.55 * scaleGebOrt}rem`;

            const pFotoImg = document.getElementById('pFotoImg');
            const pFotoPlaceholder = document.getElementById('pFotoPlaceholder');

            if (photoDataUrl) {
                pFotoImg.src = photoDataUrl;
                pFotoImg.classList.remove('hidden');
                pFotoPlaceholder.classList.add('hidden');
            } else {
                pFotoImg.classList.add('hidden');
                pFotoPlaceholder.classList.remove('hidden');
            }
        }

        /**
         * STREAMING_CHUNK:Defining PDF generation and print logic...
         * Generates the PDF document (A4 Landscape) and places items at the bottom-left panel
         */
        function generateAndPrintPDF(event) {
            event.preventDefault();

            const gebAmInput = document.getElementById('gebAm');
            finalizeDateInput(gebAmInput);

            if (!validateDate(gebAmInput)) {
                gebAmInput.focus();
                return;
            }

            const vorname = document.getElementById('vorname').value.trim();
            const nachname = document.getElementById('nachname').value.trim();
            const gebAm = gebAmInput.value.trim();
            const gebOrt = document.getElementById('gebOrt').value.trim();

            // Create A4 Landscape PDF (297mm x 210mm)
            const doc = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: 'a4'
            });

            // Exact Coordinates for "Inhaber des Fahrausweises" panel (Bottom-Left)
            const photoX = 6;
            const photoY = 116;
            const photoW = 28;
            const photoH = 37;

            const textX = 36;
            const maxTextWidth = 33; // Fits inside panel width limit

            doc.setFont('Helvetica', 'normal');
            doc.setTextColor(0, 0, 0);

            // 1. Vorname (1 Zeile mit Auto-Scale)
            if (vorname) {
                const fit = calculateTextFit(vorname, maxTextWidth, 9, 6.5, 1);
                doc.setFontSize(fit.fontSize);
                doc.text(fit.lines[0] || vorname, textX, 120);
            }

            // 2. Name (max. 2 Zeilen mit Auto-Scale)
            if (nachname) {
                const fit = calculateTextFit(nachname, maxTextWidth, 9, 6.5, 2);
                doc.setFontSize(fit.fontSize);
                const lineHeight = fit.fontSize * 0.42;
                fit.lines.forEach((line, idx) => {
                    doc.text(line, textX, 128 + (idx * lineHeight));
                });
            }

            // 3. geb. am (1 Zeile)
            if (gebAm) {
                doc.setFontSize(9);
                doc.text(gebAm, textX, 140);
            }

            // 4. in (max. 2 Zeilen mit Auto-Scale)
            if (gebOrt) {
                const fit = calculateTextFit(gebOrt, maxTextWidth, 9, 6.5, 2);
                doc.setFontSize(fit.fontSize);
                const lineHeight = fit.fontSize * 0.42;
                fit.lines.forEach((line, idx) => {
                    doc.text(line, textX, 146 + (idx * lineHeight));
                });
            }

            // 5. Foto (falls vorhanden)
            if (photoDataUrl) {
                try {
                    doc.addImage(photoDataUrl, 'JPEG', photoX, photoY, photoW, photoH);
                } catch (e) {
                    console.error('Fehler beim Einfügen des Fotos:', e);
                }
            }

            // Enable Auto-Print metadata
            doc.autoPrint();

            // Create Blob URL
            const pdfBlob = doc.output('blob');
            const blobUrl = URL.createObjectURL(pdfBlob);

            // Open PDF in new tab
            window.open(blobUrl, '_blank');

            // Trigger print dialog reliably using iframe
            const iframe = document.getElementById('printIframe');
            iframe.src = blobUrl;
            iframe.onload = function() {
                setTimeout(function() {
                    try {
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                    } catch (e) {
                        console.error('Druckaufruf fehlgeschlagen:', e);
                    }
                }, 300);
            };
        }

        // Initialize preview on load
        window.onload = function() {
            updatePreview();
        };
    </script>
</body>
</html>
