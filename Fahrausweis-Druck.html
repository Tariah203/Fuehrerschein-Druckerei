<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Druckgenerator mit Supabase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Container queries for dynamic scaled fonts inside document preview */
        .ausweis-container {
            container-type: inline-size;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 shadow-sm flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-600 text-white rounded-lg shadow">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-xl text-slate-900 leading-tight">PDF Druckgenerator</h1>
                <p class="text-xs text-slate-500">Fahrausweise verwalten & drucken</p>
            </div>
        </div>

        <!-- Connection Status Badge -->
        <div id="statusBadge" class="flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="statusText">Supabase verbunden</span>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1700px] w-full mx-auto">
        
        <!-- Left Panel: Form & Controls -->
        <section class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between space-y-6">
            <div class="space-y-5">
                <!-- Navigation Controls -->
                <div class="flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <button onclick="navigateRecord(-1)" id="btnPrev" class="px-3 py-1.5 bg-white border border-slate-300 rounded-md shadow-sm text-xs font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40 transition">
                        &larr; Zurück
                    </button>
                    <span id="recordCounter" class="text-xs font-semibold text-slate-600">Datensatz 0 / 0</span>
                    <button onclick="navigateRecord(1)" id="btnNext" class="px-3 py-1.5 bg-white border border-slate-300 rounded-md shadow-sm text-xs font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40 transition">
                        Vor &rarr;
                    </button>
                </div>

                <!-- Form Inputs -->
                <form id="ausweisForm" onsubmit="event.preventDefault();" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Vorname</label>
                        <input type="text" id="vorname" oninput="updateLivePreview()" placeholder="z.B. Bär" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Nachname (Name)</label>
                        <input type="text" id="nachname" oninput="updateLivePreview()" placeholder="z.B. Bambi" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Geburtsdatum</label>
                            <input type="text" id="geburtsdatum" oninput="updateLivePreview()" placeholder="12.12.2012" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Geburtsort</label>
                            <input type="text" id="geburtsort" oninput="updateLivePreview()" placeholder="z.B. Musterstadt" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                        </div>
                    </div>

                    <!-- Passfoto Upload with Thumbnail -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Passfoto</label>
                        <div class="flex items-center space-x-3">
                            <!-- Thumbnail Preview with Zoom trigger -->
                            <div id="thumbWrapper" onclick="openImageZoomModal()" class="w-12 h-14 bg-slate-100 border border-slate-300 rounded-md overflow-hidden flex items-center justify-center cursor-pointer hover:opacity-80 transition relative group">
                                <img id="thumbFoto" src="" class="w-full h-full object-cover object-left hidden" alt="Miniaturansicht">
                                <svg id="thumbPlaceholder" class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                                <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white text-[10px] font-bold transition">🔎</div>
                            </div>

                            <label class="flex-1 cursor-pointer bg-slate-50 hover:bg-slate-100 border border-slate-300 border-dashed rounded-lg p-3 text-center transition">
                                <span class="text-xs font-medium text-slate-600 block">Passfoto auswählen...</span>
                                <input type="file" id="fotoInput" accept="image/*" onchange="handleFotoUpload(event)" class="hidden">
                            </label>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-2 pt-4 border-t border-slate-200">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="resetForm()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold text-xs transition flex items-center justify-center space-x-1">
                        <span>➕ Neu</span>
                    </button>
                    <button onclick="openDeleteModal()" id="btnDelete" class="px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg font-semibold text-xs transition flex items-center justify-center space-x-1">
                        <span>🗑️ Löschen</span>
                    </button>
                </div>
                <button onclick="saveAndPrint()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold text-sm shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                    </svg>
                    <span>Drucken & Speichern</span>
                </button>
            </div>
        </section>

        <!-- Right Panel: Live Document Preview -->
        <section class="lg:col-span-8 bg-slate-800 rounded-xl shadow-inner p-2 md:p-4 flex items-center justify-center overflow-hidden min-h-[500px]">
            <!-- Responsive Container Aspect Ratio 1024 / 724 -->
            <div class="w-full max-w-[1024px] aspect-[1024/724] relative bg-white shadow-2xl overflow-hidden ausweis-container">
                <!-- Background Template Image -->
                <img id="ausweisTemplate" src="Fahrausweis-fuer-Krane-1024x724-2.jpeg" onerror="this.onerror=null; this.src='https://placehold.co/1024x724/e2e8f0/334155?text=Fahrausweis+Vorlage';" alt="Fahrausweis Vorlage" class="w-full h-full object-fill select-none">

                <!-- OVERLAY: Passfoto (Uncropped, left aligned in photo frame) -->
                <div class="absolute left-[3.2%] top-[53.5%] w-[11.2%] h-[20.2%] flex items-start justify-start overflow-hidden">
                    <img id="prevFoto" src="" class="w-full h-full object-contain object-left hidden" alt="Passfoto">
                </div>

                <!-- OVERLAY: Vorname (Indented first line, starting right after 'Vorname:', wrap starts left) -->
                <div id="prevVorname" class="absolute left-[15.5%] top-[53.2%] w-[13.5%] text-[1.1cqw] font-bold text-slate-900 leading-[1.3] pointer-events-none break-words whitespace-pre-line" style="text-indent: 2.5cqw;"></div>

                <!-- OVERLAY: Nachname (On primary line under 'Name:') -->
                <div id="prevNachname" class="absolute left-[15.5%] top-[58.8%] w-[13.5%] text-[1.1cqw] font-bold text-slate-900 leading-[1.3] pointer-events-none break-words whitespace-pre-line"></div>

                <!-- OVERLAY: Geburtsdatum (On line right behind 'geb. am:') -->
                <div id="prevGeburtsdatum" class="absolute left-[16.2%] top-[64.5%] w-[13.5%] text-[1.0cqw] font-bold text-slate-900 pointer-events-none whitespace-nowrap"></div>

                <!-- OVERLAY: Geburtsort (On line right behind 'in:') -->
                <div id="prevGeburtsort" class="absolute left-[14.2%] top-[68.8%] w-[13.5%] text-[1.0cqw] font-bold text-slate-900 pointer-events-none whitespace-nowrap"></div>
            </div>
        </section>

    </main>

    <!-- Modal: Image Zoom -->
    <div id="zoomModal" onclick="closeImageZoomModal()" class="fixed inset-0 bg-black/75 z-50 hidden items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="relative max-w-md w-full bg-white rounded-xl shadow-2xl p-4 overflow-hidden" onclick="event.stopPropagation()">
            <button onclick="closeImageZoomModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-sm font-bold text-slate-700 mb-3">Passfoto Vergrößerung</h3>
            <div class="flex justify-center bg-slate-100 rounded-lg p-2 max-h-[70vh] overflow-hidden">
                <img id="modalZoomImg" src="" class="max-h-[60vh] object-contain rounded" alt="Passfoto Großansicht">
            </div>
        </div>
    </div>

    <!-- Modal: Delete Confirmation -->
    <div id="deleteModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <div class="flex items-center space-x-3 text-rose-600">
                <div class="p-2 bg-rose-100 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h3 class="font-bold text-lg text-slate-900">Datensatz löschen?</h3>
            </div>
            <p class="text-xs text-slate-600">Möchtest du diesen Fahrausweis-Eintrag wirklich dauerhaft entfernen? Dies kann nicht rückgängig gemacht werden.</p>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeDeleteModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold">Abbrechen</button>
                <button onclick="confirmDeleteRecord()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-semibold">Löschen</button>
            </div>
        </div>
    </div>

    <script>
        // --- Application Configuration & State ---
        const RAW_SUPABASE_URL = "https://otcegorzfuyumnflanas.supabase.co";
        const RAW_SUPABASE_KEY = "sb_publishable_2cN6h2kEXJxzhYpN-wmRfA_q5Dzm6Lr";
        const TABLE_NAME = "fuehrerschein_daten";

        let supabaseClient = null;
        let isLocalMode = false;
        let records = [];
        let currentIndex = -1;
        let currentFotoUrl = "";

        // --- Initialization ---
        window.onload = function() {
            initSupabase();
            loadRecordsFromSupabase();
        };

        function setConnectionStatus(type, message) {
            const statusBadge = document.getElementById('statusBadge');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            statusText.textContent = message;
            if (type === 'emerald') {
                statusBadge.className = "flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
            } else if (type === 'amber') {
                statusBadge.className = "flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
            } else {
                statusBadge.className = "flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
            }
        }

        function initSupabase() {
            try {
                // Säubert die URL von etwaigen angehängten /rest/v1 Endpunkten für den JS Client
                let baseUrl = RAW_SUPABASE_URL.trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
                if (window.supabase && baseUrl && RAW_SUPABASE_KEY) {
                    supabaseClient = window.supabase.createClient(baseUrl, RAW_SUPABASE_KEY);
                } else {
                    switchToLocalMode("Lokaler Modus");
                }
            } catch (err) {
                console.warn("Supabase Init Error:", err);
                switchToLocalMode("Lokaler Modus");
            }
        }

        function switchToLocalMode(msg) {
            isLocalMode = true;
            setConnectionStatus("amber", msg || "Lokaler Modus");
            updateNavigationUI();
        }

        async function loadRecordsFromSupabase() {
            if (!supabaseClient || isLocalMode) return;
            try {
                const { data, error } = await supabaseClient.from(TABLE_NAME).select('*').order('created_at', { ascending: true });
                if (error) {
                    const errMsg = error.message || "";
                    if (errMsg.includes("Load failed") || errMsg.includes("Failed to fetch") || errMsg.includes("NetworkError")) {
                        switchToLocalMode("Lokaler Modus (Offline)");
                        return;
                    }
                    setConnectionStatus("amber", "Supabase: RLS/Tabelle prüfen");
                    return;
                }

                isLocalMode = false;
                setConnectionStatus("emerald", "Supabase verbunden");
                records = data || [];
                if (records.length > 0) {
                    currentIndex = records.length - 1;
                    populateFormWithRecord(records[currentIndex]);
                } else {
                    resetForm();
                }
            } catch (err) {
                console.warn("Netzwerkunterbrechung:", err);
                switchToLocalMode("Lokaler Modus");
            }
        }

        // --- Form & UI Handling ---
        function updateLivePreview() {
            const vorname = document.getElementById('vorname').value;
            const nachname = document.getElementById('nachname').value;
            const geburtsdatum = document.getElementById('geburtsdatum').value;
            const geburtsort = document.getElementById('geburtsort').value;

            document.getElementById('prevVorname').innerText = vorname;
            document.getElementById('prevNachname').innerText = nachname;
            document.getElementById('prevGeburtsdatum').innerText = geburtsdatum;
            document.getElementById('prevGeburtsort').innerText = geburtsort;

            // Update photo preview
            const prevFoto = document.getElementById('prevFoto');
            const thumbFoto = document.getElementById('thumbFoto');
            const thumbPlaceholder = document.getElementById('thumbPlaceholder');

            if (currentFotoUrl) {
                prevFoto.src = currentFotoUrl;
                prevFoto.classList.remove('hidden');
                
                thumbFoto.src = currentFotoUrl;
                thumbFoto.classList.remove('hidden');
                thumbPlaceholder.classList.add('hidden');
            } else {
                prevFoto.classList.add('hidden');
                thumbFoto.classList.add('hidden');
                thumbPlaceholder.classList.remove('hidden');
            }
        }

        function handleFotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentFotoUrl = e.target.result;
                    updateLivePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function populateFormWithRecord(rec) {
            if (!rec) return;
            document.getElementById('vorname').value = rec.vorname || '';
            document.getElementById('nachname').value = rec.nachname || '';
            document.getElementById('geburtsdatum').value = rec.geburtsdatum || '';
            document.getElementById('geburtsort').value = rec.geburtsort || '';
            currentFotoUrl = rec.foto_url || '';
            updateLivePreview();
            updateNavigationUI();
        }

        function resetForm() {
            document.getElementById('ausweisForm').reset();
            currentFotoUrl = '';
            currentIndex = records.length;
            updateLivePreview();
            updateNavigationUI();
        }

        function updateNavigationUI() {
            const total = records.length;
            const counter = document.getElementById('recordCounter');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            if (total === 0 || currentIndex < 0 || currentIndex >= total) {
                counter.textContent = `Neuer Datensatz (${total})`;
                btnPrev.disabled = total === 0;
                btnNext.disabled = true;
            } else {
                counter.textContent = `Datensatz ${currentIndex + 1} / ${total}`;
                btnPrev.disabled = currentIndex <= 0;
                btnNext.disabled = currentIndex >= total - 1;
            }
        }

        function navigateRecord(direction) {
            if (records.length === 0) return;
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= records.length) currentIndex = records.length - 1;
            populateFormWithRecord(records[currentIndex]);
        }

        // --- Persistence & Printing ---
        async function saveAndPrint() {
            const vorname = document.getElementById('vorname').value;
            const nachname = document.getElementById('nachname').value;
            const geburtsdatum = document.getElementById('geburtsdatum').value;
            const geburtsort = document.getElementById('geburtsort').value;

            const recordData = {
                vorname: vorname,
                nachname: nachname,
                geburtsdatum: geburtsdatum,
                geburtsort: geburtsort,
                foto_url: currentFotoUrl
            };

            if (supabaseClient && !isLocalMode) {
                try {
                    const { data, error } = await supabaseClient.from(TABLE_NAME).insert([recordData]).select();
                    if (error) {
                        console.warn("Supabase Speicherfehler:", error);
                        switchToLocalMode("Lokaler Modus");
                        records.push(recordData);
                        currentIndex = records.length - 1;
                    } else if (data && data.length > 0) {
                        records.push(data[0]);
                        currentIndex = records.length - 1;
                    }
                } catch (err) {
                    console.warn("Netzwerkfehler beim Speichern:", err);
                    switchToLocalMode("Lokaler Modus");
                    records.push(recordData);
                    currentIndex = records.length - 1;
                }
            } else {
                records.push(recordData);
                currentIndex = records.length - 1;
            }

            updateNavigationUI();
            generatePDF(vorname, nachname, geburtsdatum, geburtsort, currentFotoUrl);
        }

        function generatePDF(vorname, nachname, geburtsdatum, geburtsort, fotoUrl) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: 'a4'
            });

            const templateImg = document.getElementById('ausweisTemplate');

            // Draw Background Template full A4 (297 x 210 mm)
            doc.addImage(templateImg, 'JPEG', 0, 0, 297, 210);

            // Draw Photo if present (Passfoto frame: x=9.5mm, y=112.3mm, w=33.3mm, h=42.4mm)
            if (fotoUrl) {
                try {
                    doc.addImage(fotoUrl, 'JPEG', 9.5, 112.3, 33.3, 42.4);
                } catch (e) {
                    console.warn("Konnte Foto nicht ins PDF einbetten:", e);
                }
            }

            // Set font formatting
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.setTextColor(15, 23, 42); // slate-900

            // Vorname (Zeile 1 ab x=55.0mm, Zeile 2 ab x=46.0mm)
            if (vorname) {
                const vornameLines = doc.splitTextToSize(vorname, 38);
                if (vornameLines.length > 0) {
                    doc.text(vornameLines[0], 55.0, 117.2);
                }
                if (vornameLines.length > 1) {
                    doc.text(vornameLines.slice(1).join(" "), 46.0, 122.0);
                }
            }

            // Nachname (ab x=46.0mm, y=129.5mm)
            if (nachname) {
                const nachnameLines = doc.splitTextToSize(nachname, 40);
                doc.text(nachnameLines, 46.0, 129.5);
            }

            // Geburtsdatum & Geburtsort
            doc.setFontSize(10);
            if (geburtsdatum) {
                doc.text(geburtsdatum, 48.0, 141.5);
            }
            if (geburtsort) {
                doc.text(geburtsort, 42.0, 150.5);
            }

            // Open PDF Print Preview Dialog
            doc.autoPrint();
            window.open(doc.output('bloburl'), '_blank');
        }

        // --- Modal & Utility Functions ---
        function openImageZoomModal() {
            if (!currentFotoUrl) return;
            document.getElementById('modalZoomImg').src = currentFotoUrl;
            const modal = document.getElementById('zoomModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeImageZoomModal() {
            const modal = document.getElementById('zoomModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function openDeleteModal() {
            if (records.length === 0 || currentIndex < 0 || currentIndex >= records.length) return;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('deleteModal').classList.add('flex');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
        }

        async function confirmDeleteRecord() {
            closeDeleteModal();
            const rec = records[currentIndex];

            if (rec && rec.id && supabaseClient && !isLocalMode) {
                try {
                    await supabaseClient.from(TABLE_NAME).delete().eq('id', rec.id);
                } catch (err) {
                    console.warn("Fehler beim Löschen:", err);
                }
            }

            records.splice(currentIndex, 1);
            if (records.length === 0) {
                resetForm();
            } else {
                if (currentIndex >= records.length) currentIndex = records.length - 1;
                populateFormWithRecord(records[currentIndex]);
            }
        }
    </script>
</body>
